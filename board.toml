schema_version = 2

[board]
name = "liuqin"
soc = "SM8475"
soc_source = "sm8475"
os_profile = "ipados-27.0.1-24A446"
description = "Xiaomi Pad 6 Pro (liuqin, SM8475, 12GB/512GB)"
# Maps device package/ to tree/kits/sheng as required by build-sheng-source-storage.py.
kit = "sheng"

[userdata]
# Measured on this 12GB + 512GB Xiaomi Pad 6 Pro (liuqin) via fastboot getvar all (2026-11-24):
#   logical-block-size = 0x1000 (4096 bytes)
#   partition-size:userdata = 0x73D3DFB000 bytes (463.31 GiB = 0x73D3DFB 4 KiB sectors)
# Standard liuqin LUN 0 GPT places userdata (sda35) at first_lba = 0x2A1600 (2758144):
#   last_lba = 0x2A1600 + 0x73D3DFB - 1 = 0x76753FA (124212218)
first_lba = 2758144
last_lba = 124212218
lba_bytes = 4096

[components]
# Official UniXNU Format 2 components matching UniXNU-sheng (iPadOS 27 arm64e),
# adding QcomGeniSpi (NT36532 touch) and Adreno740/AdrenoMetal/AirNir for SM8475 Adreno 730 GPU/Metal.
include = [
  "ArmDTPlatform",
  "ArmCpu",
  "XnuPrelink",
  "DarwinBoot",
  "ShengUfs",
  "QcomGeniSpi",
  "RamBlock",
  "Adreno740",
  "AdrenoMetal",
  "AirNir",
  "GopFramebuffer",
  "AppleKeyStoreState",
]

[kernel]
defconfig = "liuqin_ipados27_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "component:ShengUfs",
  "build-sheng-source-storage.py --policy-dir scripts/policies/ipados-27.0.1-24A446",
  "component:RamBlock",
  "fetch-liuqin-adreno-firmware.py",
  "build-liuqin-adreno-kits.py",
  "build-adreno740-accelerator.py",
  "component:AppleKeyStoreState",
  "build-liuqin-gop-display-27.py",
  "build-fileset-release-reference.py --tree . --lto",
]
config_fragments = ["arch:configs/common.config", "soc:configs/sm8475.config", "os:configs/ipados.config"]
patch_series = [
  "arch:patches/xnu/series",
  "soc:patches/xnu-12377/series",
  "os:patches/xnu/series",
  "device:patches/xnu-12377/series",
]

[kernel.prelink]
# Skip sheng-specific stub allowlist during Stage 2 bring-up (liuqin adds
# verbose-text-console.patch and omits Adreno740, shifting 1 unused stub site
# in AppleM2ScalerCSCDriver while keeping 2 unresolved / 25 stubbed overall).
regression_policy = ""
# iPadOS 27 profile roots plus native USB device (AppleUSBXDCI/DeviceMux) and host
# (AppleUSBXHCI/Hub/HID/MassStorage) stacks matching UniXNU-sheng.
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
  "com.apple.iokit.IOUSBDeviceFamily",
  "com.apple.driver.AppleUSBXDCI",
  "com.apple.driver.AppleUSBDeviceMux",
  "com.apple.iokit.IOUSBHostFamily",
  "com.apple.driver.usb.AppleUSBXHCI",
  "com.apple.driver.usb.AppleUSBHub",
  "com.apple.driver.usb.AppleUSBHostCompositeDevice",
  "com.apple.driver.usb.IOUSBHostHIDDevice",
  "com.apple.iokit.IOUSBMassStorageDriver",
  "com.apple.iokit.IOSCSIArchitectureModelFamily",
  "com.apple.iokit.IOSCSIBlockCommandsDevice",
  "!com.apple.driver.AppleOnboardSerial",
  "!com.apple.driver.AppleSMC",
]

[device_tree]
source = "device:dts/liuqin.dts"
include_dirs = ["soc:dts"]

[firmware]
# Uses official UniXNU/uefi-sheng (Mu-Silicium + WaipioPkg) with this repository's
# firmware/ overlay (Platforms/Xiaomi/liuqinPkg and Resources/Configs/liuqin.toml).
config = "liuqin"
dsc = "Platforms/Xiaomi/liuqinPkg/liuqin.dsc"
fd = "Build/liuqinPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/prepare-uefi-overlay.py", "scripts/build-liuqin-dtb.py"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
submodules = [
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicium-ACPI",
  "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl",
]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "liuqin"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "liuqin-ipados27"

[bootimg]
dtb = "build/liuqin/liuqin.dtb"
dtb_node = [
  { path = "/reserved-memory/splash_region", props = [
    { name = "label", type = "s", value = "cont_splash_region" },
    { name = "reg", type = "x", value = ["0x0", "0xb8000000", "0x0", "0x2b00000"] },
  ] },
]

[payload]
volume = "LIUQINESP"
size_mib = 192
timeout = 5
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
loader = "firmware"
title = "iPadOS 27 (liuqin)"
dram_size = "0x80000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "-no_slto_panic",
  "use_contiguous_hint=0",
  "native-source-storage=1",
  "native-ufs-root=1",
  "offline-mobile-graphics-load=1",
  "offline-mobile-graphics-client=1",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-legacy-phase=4",
  "offline-key-events=1",
  "aks=1",
  "aks-sls=3",
  "offline-hid-input=1",
  "offline-hid-home=1",
  "touch=4",
  "touch-hid=1",
  "buttons=1",
  "backlight=1",
  "cpufreq=4",
  "smp=1",
  "dpu=1",
  "gpu-power=9",
  "gpu-metal=1",
  "fb-gpu=1",
  "fb-bgra=1",
  "no-lc=1",
  "gpu-addon=1",
  "appsync=1",
  "ci-mps=0",
  "log=1",
  "build-tag=liuqin-b31",
  "usb=1",
  "adsp=2",
  "battery=1",
  "board-clock=3",
  "vsync=60",
  "vsync-fixed=1",
  "armcpu-idle-latency-us=100000",
  "data-persist=2",
  "sheng-data-persist=2",
  "disable-watchdogd=1",
  "lite=1",
]

[payload.runtime]
tool = "scripts/build-boot-runtime.py"
target = "ios27"
build = "24A446"
data_gib = 64
skip_setup = true
trust_components = ["StaticTrustCache", "Cryptex1,SystemTrustCache", "Cryptex1,AppTrustCache"]
wallpapers = ["ipados27", "ipados27-floating"]
appsync = true

[payload.adt]
# Matches Apple iPad17,3 (0x8142) from profiles/os/ipados-27.0.1-24A446/profile.toml.
chip_id = "8142"
# 4.25 GiB owned bootstrap window inside verified DRAM High Main (0x840000000 + 0x12E000000 = 4.71 GiB).
owned_memory_size = "0x110000000"
packed_data_ramdisk = true
persistent_data = true
unique_chip_id = "required"

[adt.product.string]
model = "J820AP"
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.defaults.u32]
sleep-disabled = 1
# Qualcomm Gunyah runs at EL2; no Apple PMGR or SEP present.
vmm-present = 1
"kern.maxvnodes" = 78848

[adt.chosen.u32]
# SM8475 has no Apple CTRR hardware.
kernel-ctrr-to-be-enabled = 0

[adt.chosen.bytes]
# Development-only 48-byte boot-manifest identity (matches UniXNU-cupid bring-up)
# so native_owner_publish_boot_manifest_seeded() accepts unverified SHNGROOT windows.
"boot-manifest-hash" = "474b0ce444b41c5380e498960cc30c45f5abd2206808b3ba378278854a0ab90d80c1976832df570c55b8401b9bce093e"

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-27.0.1-24A446" = "liuqin_ipados27_defconfig"
