schema_version = 1

[device]
name = "liuqin"
soc = "SM8475"
os_profile = "ipados-27.0.1-24A446"
summary = "Xiaomi Pad 6 Pro (liuqin, SM8475, 12GB/512GB) following official UniXNU-sheng Format 2 architecture: uefi-sheng WaipioPkg overlay + ipados-27.0.1-24A446 arm64e."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "AppleKeyStoreState"]
paths = ["board.toml", "feeds.toml", "configs/**", ".github/**", ".gitignore", "local.toml.example", "README.md", "AGENTS.md", "package/.gitkeep", "soc/**", "patches/unixnu/**"]
inputs = [
  "Xiaomi Pad 6 Pro (liuqin), Qualcomm SM8475 (Cape), 12GB RAM + 512GB UFS",
  "fastboot getvar all on real hardware (2026-11-24): product=liuqin, socid=531 (0x213), unlocked=yes, current-slot=a",
  "Official UniXNU Format 2 schema and UniXNU-sheng reference configuration",
]
configuration = [
  "board.toml selects os_profile=ipados-27.0.1-24A446 (arm64e), soc_source=sm8475, and official UniXNU components.",
  "feeds.toml points sm8475 to UniXNU-sm8475-common (local override supported via local.toml).",
]
procedure = [
  "Run ./unixnu defconfig liuqin_ipados27_defconfig -D ../UniXNU-liuqin && ./unixnu status --json.",
]
findings = [
  "Following official UniXNU-sheng Format 2 with ipados-27.0.1-24A446 avoids the diverged iPadOS 18 pong fork and keeps compatibility with upstream drivers and HyperOS.",
]
completion = [
  "Configuration resolves cleanly, porting-record.py passes, and all selected components resolve.",
]
limits = [
  "Local feeds path is used until UniXNU-sm8475-common is published to a pinned remote commit.",
]
next_action = [
  "Verify ./unixnu defconfig, fetch, and status on WSL2 host.",
]
evidence = [
  { kind = "source", reference = "board.toml", result = "Format 2 board description targeting ipados-27.0.1-24A446 arm64e with verified 12GB/512GB liuqin parameters." },
]

[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["firmware/**", "proprietary-files.txt", "scripts/prepare-uefi-overlay.*", "scripts/build-liuqin-dtb.*"]
inputs = [
  "UniXNU/uefi-sheng (Mu-Silicium with Silicon/Qualcomm/WaipioPkg)",
  "Stock HyperOS OS3.0.7.0.VMYCNXM uefiplat.cfg (Stack 0xA760D000, Display Reserved 0xB8000000+0x2B00000)",
  "fastboot getvar all: socid=531 (0x213), uefi_a=0x500000, boot_a=0xC000000",
]
configuration = [
  "Platforms/Xiaomi/liuqinPkg uses WaipioPkg with LIUQIN_VENDOR_HW=0 and SimpleFbDxe (1800x2880, 32-bit).",
  "Resources/Configs/liuqin.toml sets FD 0xA7100000 + 0x300000 (0xA7000000..0xA7100000 kept as FD Reserved), BootShim ARM64 header, gzip+dtb, boot image header v4.",
]
procedure = [
  "Run ./unixnu build package && ./unixnu build firmware && ./unixnu bootimg --ramdisk none, then fastboot boot boot.img.",
]
findings = [
  "FD_BASE=0xA7000000 booted SEC to screen but failed FV LZMA decompression (Decompress Failed - Invalid Parameter) because 0xA7000000..0xA7100000 is FD Reserved/ramoops on SM8475.",
  "Moving FD_BASE to 0xA7100000 (+0x300000) booted cleanly through SEC, DXE, GIC/Timer, SimpleFbDxe (1800x2880), and displayed the UniXNU v0.1.0 UEFI menu with live countdown on HyperOS without any vendor DXE blobs.",
  "Android boot image v4 prepends Xiaomi's LZ4 vendor_ramdisk ahead of boot.img's FAT32 payload in /chosen/linux,initrd-start; patches/unixnu/0001-ramdisk-find-fat-in-initrd.patch scans past vendor_ramdisk to locate FAT32/UNXNFAT1 and was verified on hardware to mount LIUQINESP and boot iPadOS 27 (liuqin) via DarwinBoot.",
]
completion = [
  "SILICIUM_UEFI.fd and boot.img build cleanly and fastboot boot displays the UniXNU UEFI menu and launches DarwinBoot on the tablet.",
]
limits = [
  "Full MH_FILESET prelinked iPadOS 27.0.1 kernel build via GitHub Actions macos-26 is the next milestone.",
]
next_action = [
  "Run GitHub Actions macos-26 workflow to emit the full Apple Clang + LTO MH_FILESET boot.img and test on hardware.",
]
evidence = [
  { kind = "device", reference = "firmware/Resources/Configs/liuqin.toml", command = "fastboot boot liuqin-stage1-uefi.img", revision = "2b2fc0609b0fc28b01f9d2380523ced4c59a907a", result = "fastboot boot of liuqin-stage1-uefi.img (sha256 680ee381) on HyperOS 12GB/512GB Xiaomi Pad 6 Pro reached UniXNU v0.1.0 UEFI menu at 1800x2880 with working countdown timer and 0 failed drivers." },
  { kind = "device", reference = "patches/unixnu/0001-ramdisk-find-fat-in-initrd.patch", command = "fastboot boot liuqin-stage2c-v4fat.img", revision = "2b2fc0609b0fc28b01f9d2380523ced4c59a907a", result = "fastboot boot of liuqin-stage2c-v4fat.img (sha256 55fa9a1d) skipped v4 vendor_ramdisk, mounted \\EFI\\UniXNU\\unixnu.toml, displayed entry 1 iPadOS 27 (liuqin), and ran DarwinBoot -> XNU _start -> MMU enable (green + blue + magenta entry probe bars on 1800x2880 screen)." },
]

