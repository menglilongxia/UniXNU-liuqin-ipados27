#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
# Verified against SM8475 (pong / liuqin) and SM8550 (sheng) hardware boots:
#   0xA7000000 + 0x00100000  FD Reserved (ramoops start)
#   0xA7100000 + 0x00300000  UEFI FD
#   0xA7400000 + 0x00200000  UEFI FD Reserved
#
[uefi_fd]
base = 0xA7100000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
# Xiaomi Pad 6 Pro stock boot.img is Android boot image header v4 (pagesize 4096).
# Header v4 lets Qualcomm ABL honour the ARM64 Image text_offset (0xA7000000)
# embedded by BootShim.
#
[boot_image]
header_version = 4
pagesize = 4096
