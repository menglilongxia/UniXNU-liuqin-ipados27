]
findings = [
  "Device-verified on SM8475 HyperOS (2026-11-25): arm64e XNU _start, PAC_INIT_KEY_STATE, SCTLR_EL1 MMU+PAC enable, cntvct_el0 virtual counter, and PSCI SMC #0 SYSTEM_RESET all succeeded on hardware (liuqin-stage2g-probe-cntvct.img rebooted cleanly after Stage 3).",
  "Gunyah traps CNTP_* physical timer writes and physical counter probe reads; virtual timer CNTVCT_EL0 works cleanly.",
]
