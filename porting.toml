]
evidence = [
  { kind = "device", reference = "soc/sm8475/patches/xnu-12377/timers-avoid-trapped-physical-timer.patch", command = "fastboot boot liuqin-stage2g-probe-cntvct.img", revision = "2b2fc0609b0fc28b01f9d2380523ced4c59a907a", result = "Stage 3 entry probe (cntvct_el0 2s wait + PSCI SMC #0 SYSTEM_RESET placed after MSR SCTLR_EL1 + ISB) executed past MMU+PAC enable and cleanly rebooted the SM8475 Pad 6 Pro." },
]

