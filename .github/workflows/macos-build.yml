name: macOS iPadOS 27 Build (liuqin)

# Builds the official arm64e iPadOS 27.0.1 (24A446) MH_FILESET prelinked XNU
# kernel (Apple Clang + LTO), UniXNU EFI package, liuqinPkg UEFI firmware
# (with v4 vendor_ramdisk FAT scanner), payload, and boot.img on macos-26.

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Build scope: full (kernel + firmware + payload + boot.img) or kernel"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - kernel

permissions:
  contents: read

concurrency:
  group: liuqin-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      UNIXNU_UEFI: ${{ github.workspace }}/uefi-sheng
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Select newest Xcode 26 SDK
        run: |
          XCODE_DIR=$(ls -d /Applications/Xcode_26*.app/Contents/Developer /Applications/Xcode.app/Contents/Developer 2>/dev/null | sort -V | tail -1)
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          echo "Using DEVELOPER_DIR=$XCODE_DIR"

      - name: Check out UniXNU-liuqin (device repo)
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - name: Stage vendored SM8475 SoC repository
        run: |
          rm -rf UniXNU-sm8475-common
          cp -R device/soc/sm8475 UniXNU-sm8475-common
          ls -la UniXNU-sm8475-common

      - name: Check out UniXNU/UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 8542980d02b4d2cc5c32ee3542de1760b2562aac
          submodules: recursive
          path: UniXNU
          persist-credentials: false

      - name: Apply device-side UniXNU patches (v4 initrd FAT scanner & nm fix)
        working-directory: UniXNU
        run: |
          shopt -s nullglob
          for patch in ../device/patches/unixnu/*.patch; do
            echo "Applying $(basename "$patch")"
            git apply "$patch"
          done

      - name: Check out UniXNU/uefi-sheng
        if: ${{ inputs.steps == 'full' || inputs.steps == '' }}
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          persist-credentials: false

      - name: Initialize uefi-sheng submodules (excluding Binaries)
        if: ${{ inputs.steps == 'full' || inputs.steps == '' }}
        working-directory: uefi-sheng
        run: |
          git submodule update --init --depth 1 \
            Common/Mu Common/Mu_OEM_Sample Mu_Basecore Silicium-ACPI \
            Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl

      - name: Install liuqinPkg firmware overlay
        if: ${{ inputs.steps == 'full' || inputs.steps == '' }}
        run: |
          UNIXNU_UEFI="$GITHUB_WORKSPACE/uefi-sheng" \
          UNIXNU_DEVICE="$GITHUB_WORKSPACE/device" \
          python3 device/scripts/prepare-uefi-overlay.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc nasm glslang bison shaderc spirv-tools blacktop/tap/ipsw
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Restore cached Turnip/Metal/AppSync runtime
        id: runtime-cache
        if: ${{ inputs.steps == 'full' || inputs.steps == '' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            UniXNU/build/liuqin-runtime-cache/gpuaddon.bin
            UniXNU/build/liuqin-runtime-cache/owner-trust.bundle
            UniXNU/build/liuqin-runtime-cache/appsync-signer
          key: liuqin-runtime-v1-24A446-${{ hashFiles('device/patches/metal2vulkan*.patch', 'device/patches/unixnu/0004-*.patch') }}

      - name: Install Rust 1.98.0 + rust-src (for AdrenoMetal bridge)
        if: ${{ (inputs.steps == 'full' || inputs.steps == '') && steps.runtime-cache.outputs.cache-hit != 'true' }}
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          rustup run 1.98.0 rustc --version

      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          df -h "$GITHUB_WORKSPACE"

      - name: Resolve configuration and fetch sources
        id: status
        working-directory: UniXNU
        run: |
          ./unixnu defconfig liuqin_ipados27_defconfig -D ../device
          ./unixnu fetch -D ../device
          ./unixnu status --json -D ../device | tee "$RUNNER_TEMP/status.json"

      - name: Restore cached Data seed
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: UniXNU/build/liuqin-data.dbr
          key: liuqin-data-seed-v1-24A446

      - name: Prepare Data seed (--skip-setup)
        id: data
        working-directory: UniXNU
        run: |
          if [ ! -f build/liuqin-data.dbr ]; then
            os_image=$(./unixnu ipsw fetch OS -D ../device | tail -1)
            python3 ../device/scripts/build-liuqin-data-seed.py \
              --unixnu . --os-image "$os_image" \
              --output build/liuqin-data.dbr --gib 64 --build 24A446 --skip-setup
          else
            python3 ../device/scripts/build-liuqin-data-seed.py \
              --unixnu . --output build/liuqin-data.dbr --gib 64 --build 24A446 \
              --skip-setup --if-missing
          fi

      - name: Bind Data volume UUID to kernel defconfig
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          seed = json.loads(Path('build/liuqin-data.dbr.json').read_text())
          config = Path('../device/configs/liuqin_ipados27_defconfig')
          text = config.read_text()
          if 'CONFIG_XNU_OWNER_DATA_MOUNT=y' not in text:
              text += 'CONFIG_XNU_OWNER_DATA_MOUNT=y\n'
          value = f'CONFIG_XNU_OWNER_DATA_VOLUME_UUID="{seed["uuid"]}"'
          if re.search(r'^CONFIG_XNU_OWNER_DATA_VOLUME_UUID=', text, re.M):
              text = re.sub(r'^CONFIG_XNU_OWNER_DATA_VOLUME_UUID=.*$', value, text, flags=re.M)
          else:
              text += value + '\n'
          config.write_text(text)
          print('Bound Data UUID', seed['uuid'], 'seed bytes', seed['bytes'])
          PY
          ./unixnu defconfig liuqin_ipados27_defconfig -D ../device

      - name: Save Data seed cache
        if: steps.data-cache.outputs.cache-hit != 'true' && steps.data.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: UniXNU/build/liuqin-data.dbr
          key: liuqin-data-seed-v1-24A446

      - name: Build liuqin.dtb
        id: dtb
        working-directory: device
        run: python3 scripts/build-liuqin-dtb.py

      - name: Build arm64e iPadOS 27 kernel & MH_FILESET prelink
        id: kernel
        working-directory: UniXNU
        run: ./unixnu build kernel -D ../device

      - name: Prelink mapping summary
        if: always()
        working-directory: UniXNU
        run: |
          LOG=$(find out/liuqin -name prelink.log | head -1)
          if [ -n "$LOG" ]; then
            echo "== $LOG"
            tail -n 20 "$LOG"
          fi
          REPORT=$(find out/liuqin -path '*/kernel/kernel.json' | head -1)
          if [ -n "$REPORT" ]; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); s,m=d.get("stubbed",{}),d.get("missing",{}); print("mapping_complete:", d.get("mapping_complete"), "allow_missing:", d.get("allow_missing")); print("stubbed targets:", sum(len(v) for v in s.values()), "missing targets:", sum(len(v) for v in m.values()))' "$REPORT"
          fi

      - name: Build UniXNU EFI package
        id: package
        if: ${{ inputs.steps == 'full' || inputs.steps == '' }}
        working-directory: UniXNU
        run: ./unixnu build package -D ../device

      - name: Build liuqinPkg UEFI firmware (SILICIUM_UEFI.fd)
        id: firmware
        if: ${{ inputs.steps == 'full' || inputs.steps == '' }}
        working-directory: UniXNU
        run: ./unixnu build firmware -D ../device --uefi ../uefi-sheng

      - name: Build Turnip/Metal/AppSync runtime & payload.img
        id: payload
        if: ${{ inputs.steps == 'full' || inputs.steps == '' }}
        working-directory: UniXNU
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          EXTRA_ARGS=()
          CACHE_DIR="build/liuqin-runtime-cache"
          TREE_DIR="out/liuqin/ipados-27.0.1-24A446/liuqin_ipados27/tree"
          if [ -f "$CACHE_DIR/gpuaddon.bin" ] && [ -f "$CACHE_DIR/owner-trust.bundle" ]; then
            echo "CACHE HIT: reusing prebuilt Turnip/Metal gpuaddon.bin & owner-trust.bundle (skipping 35 min Rust/Mesa compile)"
            if [ -d "$CACHE_DIR/appsync-signer" ]; then
              mkdir -p "$TREE_DIR/.cache"
              rm -rf "$TREE_DIR/.cache/appsync-signer"
              cp -R "$CACHE_DIR/appsync-signer" "$TREE_DIR/.cache/appsync-signer"
            fi
            EXTRA_ARGS+=(--gpu-addon "$CACHE_DIR/gpuaddon.bin" --owner-trust-cache "$CACHE_DIR/owner-trust.bundle")
          fi
          ./unixnu build payload -D ../device --uefi ../uefi-sheng \
            --unique-chip-id "${UNIXNU_UNIQUE_CHIP_ID:-0x84750A0B0C0D0001}" \
            --data-ramdisk build/liuqin-data.dbr \
            "${EXTRA_ARGS[@]}"
          if [ "${{ steps.runtime-cache.outputs.cache-hit }}" != "true" ]; then
            RT_DIR="out/liuqin/ipados-27.0.1-24A446/liuqin_ipados27/runtime"
            mkdir -p "$CACHE_DIR"
            cp "$RT_DIR/gpuaddon.bin" "$CACHE_DIR/gpuaddon.bin"
            if [ -f "$RT_DIR/appsync-owner-trust.bundle" ]; then
              cp "$RT_DIR/appsync-owner-trust.bundle" "$CACHE_DIR/owner-trust.bundle"
            else
              cp "$RT_DIR/owner-trust.bundle" "$CACHE_DIR/owner-trust.bundle"
            fi
            if [ -d "$TREE_DIR/.cache/appsync-signer" ]; then
              rm -rf "$CACHE_DIR/appsync-signer"
              cp -R "$TREE_DIR/.cache/appsync-signer" "$CACHE_DIR/appsync-signer"
            fi
            ls -lh "$CACHE_DIR"
          fi

      - name: Save Turnip/Metal/AppSync runtime cache
        if: ${{ (inputs.steps == 'full' || inputs.steps == '') && steps.runtime-cache.outputs.cache-hit != 'true' && steps.payload.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            UniXNU/build/liuqin-runtime-cache/gpuaddon.bin
            UniXNU/build/liuqin-runtime-cache/owner-trust.bundle
            UniXNU/build/liuqin-runtime-cache/appsync-signer
          key: liuqin-runtime-v1-24A446-${{ hashFiles('device/patches/metal2vulkan*.patch', 'device/patches/unixnu/0004-*.patch') }}

      - name: Build boot.img
        id: bootimg
        if: ${{ inputs.steps == 'full' || inputs.steps == '' }}
        working-directory: UniXNU
        run: |
          ./unixnu bootimg -D ../device --uefi ../uefi-sheng \
            --dtb ../device/build/liuqin/liuqin.dtb
          ls -lh out/liuqin/*/*/boot/boot.img
          shasum -a 256 out/liuqin/*/*/boot/boot.img

      - name: Upload boot.img & kernel diagnostics
        if: always() && steps.bootimg.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: liuqin-ipados27-bootimg
          path: |
            UniXNU/out/liuqin/*/*/boot/boot.img
            UniXNU/out/liuqin/*/*/payload/payload.json
            UniXNU/out/liuqin/*/*/kernel/kernel.json
            UniXNU/build/liuqin-data.dbr.json
          if-no-files-found: error
          retention-days: 7

      - name: Print failure logs inline
        if: failure()
        working-directory: UniXNU
        run: |
          for f in $(find out/liuqin -name '*.log' -o -name 'lto-build.log' | sort); do
            if grep -qE "Undefined symbols|error:|failed|regression" "$f" 2>/dev/null; then
              echo "=== $f (tail) ==="
              tail -n 35 "$f"
            fi
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liuqin-ipados27-logs
          path: |
            ${{ runner.temp }}/status.json
            UniXNU/out/liuqin/*/*/logs/*.log
            UniXNU/out/liuqin/*/*/kernel/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Clean Apple inputs
        if: always()
        run: rm -rf UniXNU/out/ipsw UniXNU/out/feeds

      - name: Summary
        if: always()
        run: |
          {
            echo "## Xiaomi Pad 6 Pro (liuqin, SM8475) — iPadOS 27.0.1 (24A446, arm64e)"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| resolve & fetch | ${{ steps.status.outcome }} |"
            echo "| liuqin.dtb | ${{ steps.dtb.outcome }} |"
            echo "| kernel + MH_FILESET prelink | ${{ steps.kernel.outcome }} |"
            echo "| UniXNU.efi package | ${{ steps.package.outcome }} |"
            echo "| SILICIUM_UEFI.fd | ${{ steps.firmware.outcome }} |"
            echo "| payload.img | ${{ steps.payload.outcome }} |"
            echo "| boot.img | ${{ steps.bootimg.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
